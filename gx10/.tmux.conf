# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-resurrect / tmux-continuum -- survive a reboot or tmux server crash
# without losing sessions/windows/pane layout/working directories.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin theme configuration
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_current "󰖯"
set -g @catppuccin_window_flags_icon_last "󰖰"
set -g @catppuccin_window_flags_icon_activity "󱅫"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# Enable mouse support
set -g mouse on

# Mouse wheel scrolling on status bar to switch windows
bind-key -n WheelUpStatus previous-window
bind-key -n WheelDownStatus next-window

# Set prefix to Ctrl-a (optional, but popular)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Start indexing from 1
set -g base-index 1
setw -g pane-base-index 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- Colorful status-right, built from catppuccin's status modules ---
# This version of catppuccin/tmux doesn't auto-assemble status-right from a
# module list; each status/*.conf must be sourced, then explicitly
# concatenated in (see catppuccin/tmux's own README "Custom Status Line").
source -q ~/.tmux/plugins/tmux/status/application.conf
source -q ~/.tmux/plugins/tmux/status/date_time.conf
source -q ~/.tmux/plugins/tmux/status/session.conf

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
# CPU/RAM built directly (not via catppuccin's cpu.conf/ram.conf) because
# that module wraps the color in "#{l:#{cpu_fg_color}}" and Force-expands
# it (-agF) while building itself -- since cpu_fg_color is an async "#()"
# job, Force-expand bakes in whatever it returns at that split second
# (empty, the job hasn't finished yet) and freezes it forever. Plain static
# hex colors here + tmux-cpu's own percentage job (substituted below)
# sidesteps that entirely.
set -ag status-right "#[fg=#f9e2af,bg=default]#[fg=#11111b,bg=#f9e2af] 󰻠 #{cpu_percentage}#[fg=#f9e2af,bg=default]"
set -ag status-right "#[fg=#a6e3a1,bg=default]#[fg=#11111b,bg=#a6e3a1]  #{ram_percentage}#[fg=#a6e3a1,bg=default]"
set -ag status-right "#{E:@catppuccin_status_session}"

# tmux-cpu does a one-time literal find/replace of "#{cpu_percentage}" etc.
# in status-right at plugin-init time (not a live re-evaluation) -- so it
# must run again AFTER status-right is built above, or the TPM-triggered
# run above (which fired while status-right was still the old default)
# leaves those tokens unresolved forever.
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'

# --- Added 2026 (see docs/ENV_NOTES.md) -------------------------------------
# Same reasoning as tmux-cpu above: tmux-continuum saves by injecting a hook into
# status-right at init time. Rebuilding status-right (theme, lines above) wipes that
# hook and auto-save silently stops, so run continuum again AFTER status-right is final.
run-shell '~/.tmux/plugins/tmux-continuum/continuum.tmux'

# Deeper scrollback (it lives in memory only, so keep it moderate) and quick reload
set -g history-limit 50000
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# True colour inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Window title: the directory when a shell is in front, the program name otherwise
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# nvim sessions are restored by tmux-resurrect as well
set -g @resurrect-strategy-nvim 'session'
set -g status-interval 15
